services:
  - type: web
    name: pdfnest-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_ORIGIN
        sync: false
      - key: FILE_EXPIRY_MINUTES
        value: 60
      - key: MAX_UPLOAD_MB
        value: 50
